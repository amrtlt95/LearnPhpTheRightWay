version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: php_app
    working_dir: /var/www/html
    volumes:
      - ./../src:/var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./../src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
